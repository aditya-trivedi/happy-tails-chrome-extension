<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hello Puppy</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>Hello Puppy</h1>
  <label class="field" for="count">How many puppies?</label>
  <input id="count" type="range" min="1" max="5" step="1" value="1" />
  <p class="count-readout"><span id="count-value">1</span> puppy</p>
  <p class="hint">Changes apply to open tabs right away.</p>
  <script src="popup.js"></script>
</body>
</html>
