<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pawsome Preview</title>
  <link rel="stylesheet" href="pawsome.css" />
  <style>
    @font-face {
      font-family: Nunito;
      font-weight: 800;
      src: url("brand/fonts/Nunito-ExtraBold.ttf") format("truetype");
    }
    @font-face {
      font-family: Nunito;
      font-weight: 600;
      src: url("brand/fonts/Nunito-SemiBold.ttf") format("truetype");
    }
    html, body { margin: 0; min-height: 100%; background: #fff6ec; color: #241c3b; }
    body {
      font: 16px/1.55 Nunito, system-ui, -apple-system, sans-serif;
    }
    header {
      padding: 28px 48px 12px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header img { width: 40px; height: 40px; }
    header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      color: #43299b;
    }
    header p {
      margin: 2px 0 0;
      font-size: 14px;
      font-weight: 600;
      color: #7a7396;
    }
    article {
      max-width: 640px;
      padding: 8px 48px 120px;
    }
    h2 {
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 12px;
    }
    p { margin: 0 0 12px; }
  </style>
</head>
<body>
  <header>
    <img src="brand/mark.svg" alt="" />
    <div>
      <h1>Pawsome</h1>
      <p>A little pet for every tab.</p>
    </div>
  </header>
  <article>
    <h2>Preview</h2>
    <p>A dog and a cat share the bottom of the page. Click for a paw five, double-click to roll, shift-click to offer a treat.</p>
    <p>This page is a local preview. The shipped extension lets you pick a dog or a cat in the toolbar popup.</p>
  </article>
  <script src="pawsome-pets.js"></script>
  <script src="pawsome-engine.js"></script>
  <script>
    (function () {
      const root = document.createElement("div");
      root.id = "pawsome-root";
      document.documentElement.appendChild(root);
      const dog = window.Pawsome.createPet({ root, species: "dog", startX: 220, roam: false });
      const cat = window.Pawsome.createPet({ root, species: "cat", startX: 620, roam: false });
      dog.el.classList.remove("pawsome-flip");
      cat.el.classList.add("pawsome-flip");
      window.addEventListener("mousemove", (e) => {
        dog.onPointerMove(e.clientX, e.clientY);
        cat.onPointerMove(e.clientX, e.clientY);
      }, { passive: true });
    })();
  </script>
</body>
</html>
